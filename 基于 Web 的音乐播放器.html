<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiMo Player — 本地音乐播放器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a09;
    --surface: #141413;
    --surface-2: #1c1c1a;
    --surface-3: #252522;
    --accent: #d4a843;
    --accent-dim: #b8922e;
    --accent-glow: rgba(212, 168, 67, 0.15);
    --text-primary: #f0ece4;
    --text-secondary: #a09888;
    --text-muted: #5a5550;
    --border: #2a2825;
    --danger: #c44040;
    --success: #4a8c5c;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', 'DM Mono', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 20%, rgba(212, 168, 67, 0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 80%, rgba(212, 168, 67, 0.02) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 2;
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(212, 168, 67, 0.2);
  }

  .logo-icon svg {
    width: 18px;
    height: 18px;
    fill: var(--bg);
  }

  .logo-text {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    color: var(--text-primary);
    letter-spacing: 0.02em;
  }

  .logo-text span {
    color: var(--accent);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .clock {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    padding: 4px 12px;
    border-right: 1px solid var(--border);
    min-width: 80px;
    text-align: center;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 400;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.03em;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  /* ── Main Layout ── */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* ── Sidebar / Playlist ── */
  .sidebar {
    width: 340px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
  }

  .track-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .playlist {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-track { background: transparent; }
  .playlist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
  }

  .track-item:hover {
    background: var(--surface-2);
  }

  .track-item.active {
    background: var(--accent-glow);
    border: 1px solid rgba(212, 168, 67, 0.15);
  }

  .track-item.active .track-name {
    color: var(--accent);
  }

  .track-number {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    width: 24px;
    text-align: center;
    flex-shrink: 0;
  }

  .track-item.active .track-number {
    color: var(--accent);
  }

  .playing-indicator {
    display: none;
  }

  .track-item.active .track-number span { display: none; }
  .track-item.active .playing-indicator {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    justify-content: center;
  }

  .playing-indicator .bar {
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    animation: eq 0.8s ease-in-out infinite alternate;
  }

  .playing-indicator .bar:nth-child(1) { height: 40%; animation-delay: 0s; }
  .playing-indicator .bar:nth-child(2) { height: 70%; animation-delay: 0.2s; }
  .playing-indicator .bar:nth-child(3) { height: 50%; animation-delay: 0.4s; }

  @keyframes eq {
    0% { height: 30%; }
    100% { height: 100%; }
  }

  .track-info {
    flex: 1;
    min-width: 0;
  }

  .track-name {
    font-size: 13px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .track-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-duration {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  /* ── Drop Zone ── */
  .drop-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
  }

  .drop-zone.has-tracks {
    display: none;
  }

  .drop-icon {
    width: 80px;
    height: 80px;
    border: 2px dashed var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    transition: all 0.3s ease;
  }

  .drop-icon svg {
    width: 32px;
    height: 32px;
    fill: var(--text-muted);
    transition: fill 0.3s ease;
  }

  .drop-zone.dragging .drop-icon {
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .drop-zone.dragging .drop-icon svg {
    fill: var(--accent);
  }

  .drop-text {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .drop-hint {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  /* ── Center Stage ── */
  .center-stage {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    gap: 32px;
  }

  .center-stage.visible {
    display: flex;
  }

  /* Visualizer */
  .visualizer-wrap {
    width: 320px;
    height: 320px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vinyl {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, var(--bg) 18%, transparent 19%),
      radial-gradient(circle at center, var(--surface-3) 20%, transparent 21%),
      repeating-radial-gradient(circle at center, transparent 0px, transparent 4px, rgba(255,255,255,0.02) 4px, rgba(255,255,255,0.02) 5px),
      radial-gradient(circle at center, #1a1917 0%, #0f0e0d 100%);
    box-shadow:
      0 0 0 3px var(--surface-3),
      0 0 60px rgba(0,0,0,0.5),
      inset 0 0 40px rgba(0,0,0,0.3);
    animation: spin 4s linear infinite;
    animation-play-state: paused;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vinyl.playing {
    animation-play-state: running;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .vinyl-label {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8b6914);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
  }

  .vinyl-label svg {
    width: 28px;
    height: 28px;
    fill: rgba(0,0,0,0.4);
  }

  .visualizer-canvas {
    position: absolute;
    inset: -20px;
    pointer-events: none;
  }

  /* Now Playing Info */
  .now-playing-info {
    text-align: center;
    max-width: 400px;
  }

  .now-playing-title {
    font-family: 'Instrument Serif', serif;
    font-size: 26px;
    color: var(--text-primary);
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 500px;
  }

  .now-playing-artist {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
  }

  /* ── Lyrics ── */
  .lyrics-section {
    max-height: 180px;
    overflow-y: auto;
    width: 100%;
    max-width: 500px;
    text-align: center;
    scroll-behavior: smooth;
    padding: 8px 0;
  }
  .lyrics-section::-webkit-scrollbar { width: 3px; }
  .lyrics-section::-webkit-scrollbar-track { background: transparent; }
  .lyrics-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .lyrics-line {
    transition: color 0.2s ease, font-weight 0.2s ease;
    padding: 2px 0;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }
  .lyrics-line.active {
    color: var(--accent);
    font-weight: 500;
  }

  /* Progress */
  .progress-section {
    width: 100%;
    max-width: 500px;
  }

  .progress-bar-wrap {
    width: 100%;
    height: 6px;
    background: var(--surface-3);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    margin-bottom: 8px;
  }

  .progress-bar-wrap:hover {
    height: 8px;
  }

  .progress-bar-wrap:hover .progress-thumb {
    opacity: 1;
  }

  .progress-filled {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 3px;
    position: relative;
    transition: width 0.1s linear;
    max-width: 100%;
  }

  .progress-thumb {
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(212, 168, 67, 0.4);
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .progress-times {
    display: flex;
    justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border-radius: 50%;
    position: relative;
  }

  .ctrl-btn:hover {
    color: var(--text-primary);
  }

  .ctrl-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .ctrl-btn.active {
    color: var(--accent);
  }

  .ctrl-btn.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }

  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    box-shadow: 0 4px 20px rgba(212, 168, 67, 0.3);
  }

  .play-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 30px rgba(212, 168, 67, 0.5);
  }

  .play-btn:active {
    transform: scale(0.96);
  }

  .play-btn svg {
    width: 22px;
    height: 22px;
    fill: var(--bg);
  }

  /* Volume */
  .volume-section {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .volume-section svg {
    width: 16px;
    height: 16px;
    fill: var(--text-muted);
    flex-shrink: 0;
    cursor: pointer;
    transition: fill 0.2s ease;
  }

  .volume-section svg:hover { fill: var(--text-secondary); }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100px;
    height: 4px;
    background: var(--surface-3);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(212, 168, 67, 0.3);
  }

  .volume-val {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    width: 30px;
    text-align: right;
  }

  /* ── Bottom Bar ── */
  .bottom-bar {
    border-top: 1px solid var(--border);
    padding: 10px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .bottom-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .bottom-center {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .bottom-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .format-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* ── Empty State for Playlist ── */
  .playlist-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  .playlist-empty-text {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.8;
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-up {
    animation: fadeUp 0.5s ease forwards;
  }

  .fade-up-d1 { animation-delay: 0.1s; opacity: 0; }
  .fade-up-d2 { animation-delay: 0.2s; opacity: 0; }
  .fade-up-d3 { animation-delay: 0.3s; opacity: 0; }

  /* ── Hidden file input ── */
  #fileInput { display: none; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .sidebar { width: 280px; }
    .visualizer-wrap { width: 240px; height: 240px; }
    .vinyl { width: 200px; height: 200px; }
    .vinyl-label { width: 72px; height: 72px; }
  }

  @media (max-width: 700px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid var(--border); }
    .center-stage { padding: 20px; gap: 20px; }
    .visualizer-wrap { width: 180px; height: 180px; }
    .vinyl { width: 160px; height: 160px; }
    .vinyl-label { width: 56px; height: 56px; }
    .now-playing-title { font-size: 20px; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <div class="logo-text">MiMo <span>Player</span></div>
  </div>
  <div class="header-actions">
    <div class="clock" id="clock">----.--.--  --:--:--</div>
    <button class="btn" id="folderBtn" title="选择音乐文件夹，下次自动加载">
      <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
      选择文件夹
    </button>
    <button class="btn" id="addFilesBtn">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      添加文件
    </button>
  </div>
</div>

<!-- Main -->
<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">播放列表</div>
      <div class="track-count" id="trackCount">0 首</div>
    </div>
    <div class="playlist" id="playlist">
      <div class="drop-zone" id="dropZone">
        <div class="drop-icon">
          <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        </div>
        <div class="drop-text">拖放音乐文件到这里</div>
        <div class="drop-hint">支持 MP3 / WAV / OGG / FLAC / AAC / M4A</div>
      </div>
      <div class="playlist-empty" id="playlistEmpty" style="display:none;">
        <div class="playlist-empty-text">播放列表为空<br>点击上方「添加音乐」开始</div>
      </div>
    </div>
  </div>

  <!-- Center Stage -->
  <div class="center-stage" id="centerStage">
    <div class="visualizer-wrap fade-up fade-up-d1">
      <div class="vinyl" id="vinyl">
        <div class="vinyl-label">
          <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
      </div>
      <canvas class="visualizer-canvas" id="visualizerCanvas"></canvas>
    </div>

    <div class="now-playing-info fade-up fade-up-d2">
      <div class="now-playing-title" id="nowPlayingTitle">—</div>
      <div class="now-playing-artist" id="nowPlayingArtist">未知艺术家</div>
    </div>

    <!-- 歌词区域 -->
    <div class="lyrics-section fade-up fade-up-d2" id="lyricsSection" style="display:none;">
      <div id="lyricsContainer"></div>
    </div>

    <div class="progress-section fade-up fade-up-d3">
      <div class="progress-bar-wrap" id="progressBar">
        <div class="progress-filled" id="progressFilled" style="width:0%">
          <div class="progress-thumb"></div>
        </div>
      </div>
      <div class="progress-times">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <div class="controls fade-up fade-up-d3">
      <button class="ctrl-btn" id="shuffleBtn" title="随机播放">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="ctrl-btn" id="prevBtn" title="上一曲">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" title="播放/暂停">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="下一曲">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" title="循环模式">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <div class="volume-section fade-up fade-up-d3">
      <svg viewBox="0 0 24 24" id="volumeIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
      <span class="volume-val" id="volumeVal">80%</span>
    </div>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <div class="bottom-left">
    <span class="format-badge" id="formatBadge" style="display:none;">MP3</span>
  </div>
  <div class="bottom-center"></div>
  <div class="bottom-right">
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);">MiMo Player v1.0</span>
  </div>
</div>

<input type="file" id="fileInput" multiple accept="audio/*">

<script>
(() => {
  // ── State ──
  const state = {
    tracks: [],
    currentIndex: -1,
    isPlaying: false,
    shuffle: false,
    repeat: 0,
    volume: 0.8,
    lyrics: null,          // 存储当前歌词 { lines: [{time, text}] }
  };

  // ── Audio setup ──
  const audio = new Audio();
  audio.volume = state.volume;

  let audioCtx, analyser, source, dataArray, bufferLength;
  let visualizerInitialized = false;

  function initAudioContext() {
    if (visualizerInitialized) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    visualizerInitialized = true;
  }

  // ── DOM ──
  const $ = id => document.getElementById(id);
  const dropZone = $('dropZone');
  const playlistEl = $('playlist');
  const playlistEmpty = $('playlistEmpty');
  const trackCount = $('trackCount');
  const centerStage = $('centerStage');
  const vinyl = $('vinyl');
  const playBtn = $('playBtn');
  const playIcon = $('playIcon');
  const prevBtn = $('prevBtn');
  const nextBtn = $('nextBtn');
  const shuffleBtn = $('shuffleBtn');
  const repeatBtn = $('repeatBtn');
  const progressBar = $('progressBar');
  const progressFilled = $('progressFilled');
  const currentTimeEl = $('currentTime');
  const totalTimeEl = $('totalTime');
  const nowPlayingTitle = $('nowPlayingTitle');
  const nowPlayingArtist = $('nowPlayingArtist');
  const volumeSlider = $('volumeSlider');
  const volumeVal = $('volumeVal');
  const volumeIcon = $('volumeIcon');
  const formatBadge = $('formatBadge');
  const fileInput = $('fileInput');
  const addFilesBtn = $('addFilesBtn');
  const canvas = $('visualizerCanvas');
  const ctx = canvas.getContext('2d');
  const lyricsContainer = $('lyricsContainer');
  const lyricsSection = $('lyricsSection');

  // ── File Handling ──
  addFilesBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  document.body.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragging');
  });

  document.body.addEventListener('dragleave', e => {
    if (!e.relatedTarget || e.relatedTarget === document.documentElement) {
      dropZone.classList.remove('dragging');
    }
  });

  document.body.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragging');
    handleFiles(e.dataTransfer.files);
  });

  function handleFiles(files) {
    // 处理 .lrc 文件（如果单独拖入）
    const lrcFiles = [...files].filter(f => f.name.toLowerCase().endsWith('.lrc'));
    if (lrcFiles.length) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        parseLRC(content);
      };
      reader.readAsText(lrcFiles[0]);
      // 如果有歌词文件，我们继续处理音频，但不影响
    }

    const audioFiles = [...files].filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|aac|m4a|wma)$/i.test(f.name));
    if (!audioFiles.length) return;

    audioFiles.forEach(file => {
      const url = URL.createObjectURL(file);
      const name = file.name.replace(/\.[^/.]+$/, '');
      let title = name, artist = '未知艺术家';
      const match = name.match(/^(.+?)\s*[-–—]\s*(.+)$/);
      if (match) {
        artist = match[1].trim();
        title = match[2].trim();
      }
      const ext = file.name.split('.').pop().toUpperCase();
      state.tracks.push({ url, title, artist, ext, file, lrc: null });
    });

    renderPlaylist();
    if (state.currentIndex === -1) {
      loadTrack(0);
    }
  }

  function renderPlaylist() {
    const hasTracks = state.tracks.length > 0;
    dropZone.style.display = hasTracks ? 'none' : 'flex';
    playlistEmpty.style.display = hasTracks ? 'none' : 'flex';
    trackCount.textContent = `${state.tracks.length} 首`;

    playlistEl.querySelectorAll('.track-item').forEach(el => el.remove());

    state.tracks.forEach((track, i) => {
      const el = document.createElement('div');
      el.className = 'track-item' + (i === state.currentIndex ? ' active' : '');
      el.innerHTML = `
        <div class="track-number">
          <span>${i + 1}</span>
          <div class="playing-indicator">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          </div>
        </div>
        <div class="track-info">
          <div class="track-name">${track.title}</div>
          <div class="track-meta">${track.artist}</div>
        </div>
        <div class="track-duration">${track.ext}</div>
      `;
      el.addEventListener('click', () => {
        loadTrack(i);
        play();
      });
      playlistEl.appendChild(el);
    });
  }

  // ── Playback ──
  function loadTrack(index) {
    if (index < 0 || index >= state.tracks.length) return;

    // 释放上一个 blob URL
    if (audio.src && audio.src.startsWith('blob:')) {
      URL.revokeObjectURL(audio.src);
    }

    state.currentIndex = index;
    const track = state.tracks[index];
    audio.src = track.url;
    audio.load();

    // 大号显示歌曲名，小号显示艺术家
    nowPlayingTitle.textContent = track.title;
    nowPlayingArtist.textContent = track.artist;
    formatBadge.textContent = track.ext;
    formatBadge.style.display = 'inline-block';

    // 加载歌词（如果存在）
    if (track.lrc) {
      parseLRC(track.lrc);
    } else {
      state.lyrics = null;
      lyricsSection.style.display = 'none';
      lyricsContainer.innerHTML = '';
    }

    centerStage.classList.add('visible');
    renderPlaylist();
  }

  function play() {
    initAudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audio.play();
    state.isPlaying = true;
    vinyl.classList.add('playing');
    updatePlayIcon();
    drawVisualizer();
  }

  function pause() {
    audio.pause();
    state.isPlaying = false;
    vinyl.classList.remove('playing');
    updatePlayIcon();
  }

  function togglePlay() {
    if (state.tracks.length === 0) return;
    state.isPlaying ? pause() : play();
  }

  function updatePlayIcon() {
    playIcon.innerHTML = state.isPlaying
      ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  function playNext() {
    if (state.tracks.length === 0) return;
    if (state.repeat === 2) {
      audio.currentTime = 0;
      play();
      return;
    }
    let next;
    if (state.shuffle) {
      next = Math.floor(Math.random() * state.tracks.length);
    } else {
      next = (state.currentIndex + 1) % state.tracks.length;
      if (next === 0 && state.repeat === 0) {
        pause();
        return;
      }
    }
    loadTrack(next);
    play();
  }

  function playPrev() {
    if (state.tracks.length === 0) return;
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }
    let prev;
    if (state.shuffle) {
      prev = Math.floor(Math.random() * state.tracks.length);
    } else {
      prev = (state.currentIndex - 1 + state.tracks.length) % state.tracks.length;
    }
    loadTrack(prev);
    play();
  }

  // ── LRC 解析与渲染 ──
  function parseLRC(text) {
    const lines = text.split('\n');
    const parsed = [];
    const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2})\](.*)/;
    for (let line of lines) {
      const match = line.match(timeRegex);
      if (match) {
        const minutes = parseInt(match[1], 10);
        const seconds = parseInt(match[2], 10);
        const centiseconds = parseInt(match[3], 10);
        const time = minutes * 60 + seconds + centiseconds / 100;
        const text = match[4].trim();
        if (text) {
          parsed.push({ time, text });
        }
      }
    }
    parsed.sort((a, b) => a.time - b.time);
    state.lyrics = { lines: parsed };
    displayLyrics();
  }

  function displayLyrics() {
    if (!state.lyrics || !state.lyrics.lines.length) {
      lyricsSection.style.display = 'none';
      lyricsContainer.innerHTML = '';
      return;
    }
    lyricsSection.style.display = 'block';
    lyricsContainer.innerHTML = state.lyrics.lines.map((line, i) =>
      `<div class="lyrics-line" data-index="${i}">${line.text}</div>`
    ).join('');
    updateLyrics(0);
  }

  function updateLyrics(currentTime) {
    const lines = state.lyrics?.lines;
    if (!lines) return;
    let activeIndex = -1;
    for (let i = lines.length - 1; i >= 0; i--) {
      if (lines[i].time <= currentTime) {
        activeIndex = i;
        break;
      }
    }
    const items = lyricsContainer.querySelectorAll('.lyrics-line');
    items.forEach((el, idx) => {
      el.classList.toggle('active', idx === activeIndex);
    });
    if (activeIndex >= 0) {
      const activeEl = items[activeIndex];
      if (activeEl) {
        activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }
  }

  // ── Events ──
  playBtn.addEventListener('click', togglePlay);
  nextBtn.addEventListener('click', playNext);
  prevBtn.addEventListener('click', playPrev);

  shuffleBtn.addEventListener('click', () => {
    state.shuffle = !state.shuffle;
    shuffleBtn.classList.toggle('active', state.shuffle);
  });

  repeatBtn.addEventListener('click', () => {
    state.repeat = (state.repeat + 1) % 3;
    repeatBtn.classList.toggle('active', state.repeat > 0);
    if (state.repeat === 2) {
      repeatBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><text x="12" y="15" text-anchor="middle" font-size="7" fill="currentColor" font-weight="bold">1</text></svg>';
    } else {
      repeatBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>';
    }
  });

  audio.addEventListener('ended', playNext);

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFilled.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
    totalTimeEl.textContent = formatTime(audio.duration);
    // 歌词同步
    updateLyrics(audio.currentTime);
  });

  progressBar.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  // Volume
  volumeSlider.addEventListener('input', () => {
    state.volume = volumeSlider.value / 100;
    audio.volume = state.volume;
    volumeVal.textContent = volumeSlider.value + '%';
    updateVolumeIcon();
  });

  volumeIcon.addEventListener('click', () => {
    if (audio.volume > 0) {
      state.prevVolume = audio.volume;
      audio.volume = 0;
      volumeSlider.value = 0;
      volumeVal.textContent = '0%';
    } else {
      audio.volume = state.prevVolume || 0.8;
      volumeSlider.value = audio.volume * 100;
      volumeVal.textContent = Math.round(audio.volume * 100) + '%';
    }
    updateVolumeIcon();
  });

  function updateVolumeIcon() {
    const v = audio.volume;
    if (v === 0) {
      volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
    } else if (v < 0.5) {
      volumeIcon.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
    } else {
      volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    }
  }

  // ── Folder Persistence ──
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('MiMoPlayerDB', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveFolderHandle(handle) {
    const db = await openDB();
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(handle, 'musicDir');
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadFolderHandle() {
    const db = await openDB();
    const tx = db.transaction('handles', 'readonly');
    const store = tx.objectStore('handles');
    return new Promise((resolve, reject) => {
      const req = store.get('musicDir');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function scanFolderRecursive(handle) {
    const audioFiles = [];
    const lrcFiles = [];
    for await (const entry of handle.values()) {
      if (entry.kind === 'file') {
        const file = await entry.getFile();
        const name = file.name.toLowerCase();
        if (name.endsWith('.lrc')) {
          lrcFiles.push(file);
        } else if (file.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|aac|m4a|wma)$/i.test(name)) {
          audioFiles.push(file);
        }
      } else if (entry.kind === 'directory') {
        const sub = await scanFolderRecursive(entry);
        audioFiles.push(...sub.audioFiles);
        lrcFiles.push(...sub.lrcFiles);
      }
    }
    return { audioFiles, lrcFiles };
  }

  async function loadFolder(handle) {
    try {
      const opts = { mode: 'read' };
      let perm = await handle.queryPermission(opts);
      if (perm !== 'granted') perm = await handle.requestPermission(opts);
      if (perm !== 'granted') return;
    } catch { return; }

    const { audioFiles, lrcFiles } = await scanFolderRecursive(handle);
    if (!audioFiles.length) return;

    const lyricsMap = {};
    for (const lrcFile of lrcFiles) {
      const baseName = lrcFile.name.replace(/\.lrc$/i, '').toLowerCase();
      try {
        const text = await lrcFile.text();
        lyricsMap[baseName] = text;
      } catch {}
    }

    audioFiles.forEach(file => {
      const url = URL.createObjectURL(file);
      const name = file.name.replace(/\.[^/.]+$/, '');
      let title = name, artist = '未知艺术家';
      const match = name.match(/^(.+?)\s*[-–—]\s*(.+)$/);
      if (match) {
        artist = match[2].trim();
        title = match[1].trim();
      }
      const ext = file.name.split('.').pop().toUpperCase();
      const lrcContent = lyricsMap[name.toLowerCase()] || null;
      state.tracks.push({ url, title, artist, ext, file, lrc: lrcContent });
    });

    renderPlaylist();
    if (state.currentIndex === -1) {
      loadTrack(0);
    }
    await saveFolderHandle(handle);
    folderBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> 已关联文件夹';
    folderBtn.title = '已记忆此文件夹，下次自动加载';
    folderBtn.style.borderColor = 'var(--success)';
    folderBtn.style.color = 'var(--success)';
  }

  const folderBtn = $('folderBtn');
  let savedHandle = null;

  async function pickFolder() {
    if (!window.showDirectoryPicker) { alert('当前浏览器不支持选择文件夹，请使用 Chrome / Edge 最新版。'); return; }
    try {
      const handle = await window.showDirectoryPicker();
      await loadFolder(handle);
    } catch {}
  }

  folderBtn.addEventListener('click', async () => {
    if (savedHandle) {
      try {
        const opts = { mode: 'read' };
        const ok = await savedHandle.requestPermission(opts);
        if (ok === 'granted') {
          await loadFolder(savedHandle);
          return;
        }
      } catch {}
    }
    await pickFolder();
  });

  (async function restoreFolder() {
    if (!window.showDirectoryPicker) return;
    const handle = await loadFolderHandle();
    if (!handle) return;
    savedHandle = handle;
    const opts = { mode: 'read' };
    const granted = await handle.queryPermission(opts) === 'granted';
    if (granted) {
      await loadFolder(handle);
    } else {
      folderBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> 点击恢复上次的文件夹';
      folderBtn.style.borderColor = 'var(--accent)';
      folderBtn.style.color = 'var(--accent)';
      folderBtn.title = '点击重新授权，恢复上次关联的音乐文件夹';
    }
  })();

  // ── Keyboard ──
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); }
    if (e.code === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); }
    if (e.code === 'ArrowUp') { e.preventDefault(); volumeSlider.value = Math.min(100, +volumeSlider.value + 5); volumeSlider.dispatchEvent(new Event('input')); }
    if (e.code === 'ArrowDown') { e.preventDefault(); volumeSlider.value = Math.max(0, +volumeSlider.value - 5); volumeSlider.dispatchEvent(new Event('input')); }
  });

  // ── Visualizer ──
  function resizeCanvas() {
    canvas.width = canvas.offsetWidth * window.devicePixelRatio;
    canvas.height = canvas.offsetHeight * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawVisualizer() {
    if (!state.isPlaying || !analyser) return;
    requestAnimationFrame(drawVisualizer);

    analyser.getByteFrequencyData(dataArray);
    const w = canvas.offsetWidth;
    const h = canvas.offsetHeight;
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2;
    const radius = 130;
    const bars = 64;
    const step = Math.floor(bufferLength / bars);

    for (let i = 0; i < bars; i++) {
      const val = dataArray[i * step] / 255;
      const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
      const barH = 8 + val * 50;

      const x1 = cx + Math.cos(angle) * radius;
      const y1 = cy + Math.sin(angle) * radius;
      const x2 = cx + Math.cos(angle) * (radius + barH);
      const y2 = cy + Math.sin(angle) * (radius + barH);

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = `rgba(212, 168, 67, ${0.3 + val * 0.7})`;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }

  // ── Clock ──
  const clock = $('clock');
  function updateClock() {
    const now = new Date();
    const y = now.getFullYear();
    const mon = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    clock.textContent = y + '.' + mon + '.' + d + '  ' + h + ':' + m + ':' + s;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── Helpers ──
  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }
})();
</script>
