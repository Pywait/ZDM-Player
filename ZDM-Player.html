<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZDM-Player — 本地音乐播放器</title>
<!-- 标签图标（内联 SVG 音符） -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23d4a843' d='M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 基础变量（默认黑金主题） ===== */
  :root {
    --bg: #0a0a09;
    --surface: #141413;
    --surface-2: #1c1c1a;
    --surface-3: #252522;
    --accent: #d4a843;
    --accent-dim: #b8922e;
    --accent-glow: rgba(212, 168, 67, 0.15);
    --text-primary: #f0ece4;
    --text-secondary: #a09888;
    --text-muted: #5a5550;
    --border: #2a2825;
    --danger: #c44040;
    --success: #4a8c5c;
    --radius: 12px;
    --radius-sm: 8px;
    --color-scrollbar: var(--border);
    --color-scrollbar-hover: var(--accent);
  }

  /* ===== 暗色主题（7个） ===== */
  [data-theme="dark-green"] {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface-2: #181818;
    --surface-3: #202820;
    --accent: #00ff41;
    --accent-dim: #00cc44;

    --text-secondary: #6a8a6a;
    --text-muted: #4a5a4a;
    --border: #1f3f1f;
    --danger: #cc0000;
    --success: #00cc44;
    --color-scrollbar: #00cc44;
    --color-scrollbar-hover: #00ff55;
  }
  [data-theme="cyber"] {
    --bg: #0B0C10;
    --surface: #1A1A2E;
    --surface-2: #1F1F3A;
    --surface-3: #252545;
    --accent: #00D2FF;
    --accent-dim: #00AACC;
    --accent-glow: rgba(0, 210, 255, 0.15);
    --text-primary: #C5C6C7;
    --text-secondary: #8888AA;
    --text-muted: #4A4A6A;
    --border: #2A2A4A;
    --danger: #FF2E63;
    --success: #00D2FF;
    --color-scrollbar: #00D2FF;
    --color-scrollbar-hover: #66E0FF;
  }
  [data-theme="titanium"] {
    --bg: #121212;
    --surface: #1E1E1E;
    --surface-2: #2A2A2A;
    --surface-3: #333333;
    --accent: #4FC3F7;
    --accent-dim: #2196F3;

    --text-secondary: #999999;
    --text-muted: #555555;
    --border: #3A3A3A;
    --danger: #EF5350;
    --success: #4FC3F7;
    --color-scrollbar: #4FC3F7;
    --color-scrollbar-hover: #81D4FA;
  }
  [data-theme="amber"] {
    --bg: #1A1A1A;
    --surface: #262626;
    --surface-2: #333322;
    --surface-3: #3A3A2A;
    --accent: #FFB000;
    --accent-dim: #CC8800;
    --accent-glow: rgba(255, 176, 0, 0.15);
    --text-primary: #D4D4D4;
    --text-secondary: #888866;
    --text-muted: #555544;
    --border: #4A4A2A;
    --danger: #FF4444;
    --success: #FFB000;
    --color-scrollbar: #FFB000;
    --color-scrollbar-hover: #FFD700;
  }
  [data-theme="deepsea"] {
    --bg: #0A192F;
    --surface: #112240;
    --surface-2: #1A2D4A;
    --surface-3: #23355A;
    --accent: #64FFDA;
    --accent-dim: #3AD0B0;
    --accent-glow: rgba(100, 255, 218, 0.15);
    --text-primary: #CCD6F6;
    --text-secondary: #8892B0;
    --text-muted: #4A6A8A;
    --border: #2A4A6A;
    --danger: #FF6B6B;
    --success: #64FFDA;
    --color-scrollbar: #64FFDA;
    --color-scrollbar-hover: #9EFFE8;
  }
  [data-theme="dark-purple"] {
    --bg: #110B1A;
    --surface: #1A1228;
    --surface-2: #2A1A3A;
    --surface-3: #332A44;
    --accent: #C084FC;
    --accent-dim: #A855F7;
    --accent-glow: rgba(192, 132, 252, 0.15);
    --text-primary: #D4C4E8;
    --text-secondary: #8877AA;
    --text-muted: #4A3A5A;
    --border: #3A2A4A;
    --danger: #F472B6;
    --success: #C084FC;
    --color-scrollbar: #C084FC;
    --color-scrollbar-hover: #D8B4FE;
  }
  [data-theme="dark-red"] {
    --bg: #0F0F0F;
    --surface: #1A0F0F;
    --surface-2: #2A1414;
    --surface-3: #3A1A1A;
    --accent: #FF4500;
    --accent-dim: #CC3300;
    --accent-glow: rgba(255, 69, 0, 0.15);
    --text-primary: #E0C0C0;
    --text-secondary: #997777;
    --text-muted: #4A2A2A;
    --border: #4A1A1A;
    --danger: #FF6B35;
    --success: #FF4500;
    --color-scrollbar: #FF4500;
    --color-scrollbar-hover: #FF6B35;
  }

  /* ===== 亮色主题（7个） ===== */
  [data-theme="light-white"] {
    --bg: #FFFFFF;
    --surface: #F8F9FA;
    --surface-2: #F0F0F0;
    --surface-3: #E8E8E8;
    --accent: #333333;
    --accent-dim: #555555;
    --accent-glow: rgba(0,0,0,0.05);
    --text-primary: #333333;
    --text-secondary: #777777;
    --text-muted: #AAAAAA;
    --border: #D0D0D0;
    --danger: #D93025;
    --success: #1A73E8;
    --color-scrollbar: #888888;
    --color-scrollbar-hover: #555555;
  }
  [data-theme="light-mint"] {
    --bg: #F0FDF4;
    --surface: #DCFCE7;
    --surface-2: #C8E6C9;
    --surface-3: #A7D0B0;
    --accent: #10B981;
    --accent-dim: #059669;
    --accent-glow: rgba(16, 185, 129, 0.15);
    --text-primary: #1A3A2A;
    --text-secondary: #5A7A6A;
    --text-muted: #8AA89A;
    --border: #A7D0B0;
    --danger: #D93025;
    --success: #10B981;
    --color-scrollbar: #10B981;
    --color-scrollbar-hover: #059669;
  }
  [data-theme="light-milk"] {
    --bg: #FEFCF3;
    --surface: #FAF6ED;
    --surface-2: #F0E8D8;
    --surface-3: #E8DDCC;
    --accent: #D4A373;
    --accent-dim: #B8895A;
    --accent-glow: rgba(212, 163, 115, 0.15);
    --text-primary: #3A3228;
    --text-secondary: #7A6A5A;
    --text-muted: #B0A090;
    --border: #D4C5A9;
    --danger: #D93025;
    --success: #D4A373;
    --color-scrollbar: #D4A373;
    --color-scrollbar-hover: #B8895A;
  }
  [data-theme="light-sky"] {
    --bg: #F0F9FF;
    --surface: #E0F2FE;
    --surface-2: #D0E8F5;
    --surface-3: #B0D0E0;
    --accent: #0284C7;
    --accent-dim: #0369A1;
    --accent-glow: rgba(2, 132, 199, 0.15);
    --text-primary: #0A2A3A;
    --text-secondary: #4A6A7A;
    --text-muted: #8AA8B8;
    --border: #7AB8D0;
    --danger: #D93025;
    --success: #0284C7;
    --color-scrollbar: #0284C7;
    --color-scrollbar-hover: #0369A1;
  }
  [data-theme="light-sakura"] {
    --bg: #FFF5F6;
    --surface: #FFE8EA;
    --surface-2: #F5D8E0;
    --surface-3: #F0D0D8;
    --accent: #F43F5E;
    --accent-dim: #E11D48;
    --accent-glow: rgba(244, 63, 94, 0.15);
    --text-primary: #3A1A2A;
    --text-secondary: #7A5A6A;
    --text-muted: #B08A92;
    --border: #E8B0B8;
    --danger: #D93025;
    --success: #F43F5E;
    --color-scrollbar: #F43F5E;
    --color-scrollbar-hover: #E11D48;
  }
  [data-theme="light-silver"] {
    --bg: #F8F9FA;
    --surface: #F1F3F5;
    --surface-2: #E9ECEF;
    --surface-3: #E4E7EC;
    --accent: #475569;
    --accent-dim: #334155;
    --accent-glow: rgba(0,0,0,0.05);
    --text-primary: #1A202C;
    --text-secondary: #475569;
    --text-muted: #94A3B8;
    --border: #D0D5DD;
    --danger: #D93025;
    --success: #1A73E8;
    --color-scrollbar: #94A3B8;
    --color-scrollbar-hover: #64748B;
  }
  [data-theme="light-orange"] {
    --bg: #FFF7ED;
    --surface: #FFEDD5;
    --surface-2: #F5E0C0;
    --surface-3: #F0D0B0;
    --accent: #EA580C;
    --accent-dim: #C2410C;
    --accent-glow: rgba(234, 88, 12, 0.15);
    --text-primary: #2A1A0A;
    --text-secondary: #6A4A2A;
    --text-muted: #B09070;
    --border: #E8B88A;
    --danger: #D93025;
    --success: #EA580C;
    --color-scrollbar: #EA580C;
    --color-scrollbar-hover: #C2410C;
  }

  /* ===== 全局重置 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', 'DM Mono', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background 0.3s, color 0.3s;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 20%, var(--accent-glow) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 80%, var(--accent-glow) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
    transition: background 0.3s;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    transition: border-color 0.3s;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px var(--accent-glow);
    transition: background 0.3s, box-shadow 0.3s;
  }

  .logo-icon svg {
    width: 18px;
    height: 18px;
    fill: var(--bg);
    transition: fill 0.3s;
  }

  .logo-text {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    color: var(--text-primary);
    letter-spacing: 0.02em;
    transition: color 0.3s;
  }

  .logo-text span {
    color: var(--accent);
    transition: color 0.3s;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .clock {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    padding: 4px 12px;
    border-right: 1px solid var(--border);
    min-width: 80px;
    text-align: center;
    transition: color 0.3s, border-color 0.3s;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 400;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.03em;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  /* 主题控制组 */
  .theme-controls {
    display: flex;
    gap: 4px;
    border-left: 1px solid var(--border);
    padding-left: 12px;
    transition: border-color 0.3s;
  }

  .theme-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    padding: 4px 8px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .theme-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }
  .theme-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .theme-dropdown {
    position: relative;
    display: inline-block;
  }

  .theme-dropdown .dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    top: 100%;
    margin-top: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    min-width: 140px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    z-index: 100;
    padding: 4px 0;
    transition: background 0.3s, border-color 0.3s;
  }

  .theme-dropdown .dropdown-content.show {
    display: block;
  }

  .theme-dropdown .dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    border: none;
    background: transparent;
    width: 100%;
    font-family: inherit;
  }
  .theme-dropdown .dropdown-item:hover {
    background: var(--surface-2);
    color: var(--accent);
  }
  .theme-dropdown .dropdown-item .color-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* ── Main Layout ── */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  /* ── Sidebar / Playlist ── */
  .sidebar {
    width: 340px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: border-color 0.3s;
  }

  .sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: border-color 0.3s;
  }

  .sidebar-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    transition: color 0.3s;
  }

  .track-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    transition: color 0.3s;
  }

  .playlist {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-track { background: transparent; }
  .playlist::-webkit-scrollbar-thumb { background: var(--color-scrollbar); border-radius: 2px; }
  .playlist::-webkit-scrollbar-thumb:hover { background: var(--color-scrollbar-hover); }

  .track-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s ease;
    position: relative;
  }

  .track-item:hover {
    background: var(--surface-2);
  }

  .track-item.active {
    background: var(--accent-glow);
    border: 1px solid var(--accent);
  }

  .track-item.active .track-name {
    color: var(--accent);
  }

  .track-number {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    width: 24px;
    text-align: center;
    flex-shrink: 0;
    transition: color 0.3s;
  }

  .track-item.active .track-number {
    color: var(--accent);
  }

  .playing-indicator {
    display: none;
  }

  .track-item.active .track-number span { display: none; }
  .track-item.active .playing-indicator {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    justify-content: center;
  }

  .playing-indicator .bar {
    width: 3px;
    background: var(--accent);
    border-radius: 1px;
    animation: eq 0.8s ease-in-out infinite alternate;
  }

  .playing-indicator .bar:nth-child(1) { height: 40%; animation-delay: 0s; }
  .playing-indicator .bar:nth-child(2) { height: 70%; animation-delay: 0.2s; }
  .playing-indicator .bar:nth-child(3) { height: 50%; animation-delay: 0.4s; }

  @keyframes eq {
    0% { height: 30%; }
    100% { height: 100%; }
  }

  .track-info {
    flex: 1;
    min-width: 0;
  }

  .track-name {
    font-size: 13px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
    transition: color 0.3s;
  }

  .track-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.3s;
  }

  .track-duration {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: color 0.3s;
  }

  /* ── Drop Zone ── */
  .drop-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
  }

  .drop-zone.has-tracks {
    display: none;
  }

  .drop-icon {
    width: 80px;
    height: 80px;
    border: 2px dashed var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    transition: all 0.3s ease;
  }

  .drop-icon svg {
    width: 32px;
    height: 32px;
    fill: var(--text-muted);
    transition: fill 0.3s ease;
  }

  .drop-zone.dragging .drop-icon {
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .drop-zone.dragging .drop-icon svg {
    fill: var(--accent);
  }

  .drop-text {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    transition: color 0.3s;
  }

  .drop-hint {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    transition: color 0.3s;
  }

  /* ── Center Stage ── */
  .center-stage {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    padding: 20px 40px;
    gap: 20px;
  }

  .center-stage.visible {
    display: flex;
  }

  .main-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    min-height: 0;
  }

  .left-panel {
    flex: 0 0 auto;
    width: 280px;             /* 固定宽度，防止被长歌名撑大 */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    overflow: hidden;         /* 防止内部溢出 */
  }

  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    max-width: 600px;
  }

  /* 视觉化包裹 */
  .visualizer-wrap {
    width: 200px;
    height: 200px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vinyl {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, var(--bg) 18%, transparent 19%),
      radial-gradient(circle at center, var(--surface-3) 20%, transparent 21%),
      repeating-radial-gradient(circle at center, transparent 0px, transparent 4px, rgba(255,255,255,0.02) 4px, rgba(255,255,255,0.02) 5px),
      radial-gradient(circle at center, #1a1917 0%, #0f0e0d 100%);
    box-shadow:
      0 0 0 3px var(--surface-3),
      0 0 60px rgba(0,0,0,0.5),
      inset 0 0 40px rgba(0,0,0,0.3);
    animation: spin 4s linear infinite;
    animation-play-state: paused;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .vinyl.playing {
    animation-play-state: running;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .vinyl-label {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
    transition: background 0.3s;
  }

  .vinyl-label svg {
    width: 24px;
    height: 24px;
    fill: rgba(0,0,0,0.4);
  }

  .visualizer-canvas {
    position: absolute;
    inset: -15px;
    pointer-events: none;
  }

  /* 歌曲信息 */
  .now-playing-info {
    text-align: center;
  }

  .now-playing-title {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    color: var(--text-primary);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 280px;
    transition: color 0.3s;
  }

  .now-playing-artist {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
    transition: color 0.3s;
  }

  /* 歌词区域 */
  .lyrics-section {
    max-height: 100%;
    overflow-y: auto;
    padding: 8px 12px;
    scroll-behavior: smooth;
    max-height: 300px;
    border-left: 1px solid var(--border);
    padding-left: 24px;
    transition: border-color 0.3s;
  }

  .lyrics-section::-webkit-scrollbar { width: 3px; }
  .lyrics-section::-webkit-scrollbar-track { background: transparent; }
  .lyrics-section::-webkit-scrollbar-thumb { background: var(--color-scrollbar); border-radius: 2px; }
  .lyrics-section::-webkit-scrollbar-thumb:hover { background: var(--color-scrollbar-hover); }

  .lyrics-line {
    transition: color 0.2s ease, font-weight 0.2s ease;
    padding: 3px 0;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.8;
    text-align: left;
  }
  .lyrics-line.active {
    color: var(--accent);
    font-weight: 500;
  }

  /* Progress */
  .progress-section {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
  }

  .progress-bar-wrap {
    width: 100%;
    height: 6px;
    background: var(--surface-3);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    margin-bottom: 8px;
    transition: background 0.3s;
  }

  .progress-bar-wrap:hover {
    height: 8px;
  }

  .progress-bar-wrap:hover .progress-thumb {
    opacity: 1;
  }

  .progress-filled {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 3px;
    position: relative;
    transition: width 0.1s linear, background 0.3s;
    max-width: 100%;
  }

  .progress-thumb {
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    opacity: 0;
    transition: opacity 0.2s ease, background 0.3s, box-shadow 0.3s;
  }

  .progress-times {
    display: flex;
    justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    transition: color 0.3s;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: 0 auto;
  }

  .ctrl-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    border-radius: 50%;
    position: relative;
  }

  .ctrl-btn:hover {
    color: var(--text-primary);
  }

  .ctrl-btn svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .ctrl-btn.active {
    color: var(--accent);
  }

  .ctrl-btn.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }

  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    box-shadow: 0 4px 20px var(--accent-glow);
  }

  .play-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 30px var(--accent-glow);
  }

  .play-btn:active {
    transform: scale(0.96);
  }

  .play-btn svg {
    width: 22px;
    height: 22px;
    fill: var(--bg);
    transition: fill 0.3s;
  }

  /* Volume */
  .volume-section {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 20px;
  }

  .volume-section svg {
    width: 16px;
    height: 16px;
    fill: var(--text-muted);
    flex-shrink: 0;
    cursor: pointer;
    transition: fill 0.2s ease;
  }

  .volume-section svg:hover { fill: var(--text-secondary); }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 80px;
    height: 4px;
    background: var(--surface-3);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    transition: background 0.3s;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px var(--accent-glow);
    transition: background 0.3s, box-shadow 0.3s;
  }

  .volume-val {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    width: 30px;
    text-align: right;
    transition: color 0.3s;
  }

  /* ── Bottom Bar ── */
  .bottom-bar {
    border-top: 1px solid var(--border);
    padding: 10px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    transition: border-color 0.3s;
  }

  .bottom-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .bottom-center {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .bottom-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .format-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
    transition: color 0.3s, border-color 0.3s;
  }

  /* ── Empty State ── */
  .playlist-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  .playlist-empty-text {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.8;
    transition: color 0.3s;
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-up {
    animation: fadeUp 0.5s ease forwards;
  }

  .fade-up-d1 { animation-delay: 0.1s; opacity: 0; }
  .fade-up-d2 { animation-delay: 0.2s; opacity: 0; }
  .fade-up-d3 { animation-delay: 0.3s; opacity: 0; }

  /* ── Hidden file input ── */
  #fileInput { display: none; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .sidebar { width: 280px; }
    .main-area { gap: 20px; }
    .visualizer-wrap { width: 160px; height: 160px; }
    .vinyl { width: 130px; height: 130px; }
    .vinyl-label { width: 56px; height: 56px; }
    .now-playing-title { font-size: 18px; max-width: 200px; }
    .lyrics-section { max-height: 200px; padding-left: 16px; }
  }

  @media (max-width: 700px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid var(--border); }
    .center-stage { padding: 16px; }
    .main-area { flex-direction: column; gap: 16px; }
    .left-panel { flex-direction: row; gap: 20px; }
    .visualizer-wrap { width: 120px; height: 120px; }
    .vinyl { width: 100px; height: 100px; }
    .vinyl-label { width: 44px; height: 44px; }
    .now-playing-title { font-size: 16px; max-width: 150px; }
    .right-panel { max-width: 100%; width: 100%; }
    .lyrics-section { border-left: none; border-top: 1px solid var(--border); padding-left: 0; padding-top: 12px; max-height: 120px; }
    .controls { flex-wrap: wrap; gap: 12px; }
    .volume-section { margin-left: 0; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
    <div class="logo-text">ZDM <span>Player</span></div>
  </div>
  <div class="header-actions">
    <div class="clock" id="clock">----.--.--  --:--:--</div>
    <button class="btn" id="folderBtn" title="选择音乐文件夹，下次自动加载">
      <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
      选择文件夹
    </button>
    <button class="btn" id="addFilesBtn">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      添加文件
    </button>
    <div class="theme-controls">
      <button class="theme-btn" id="defaultThemeBtn" title="默认主题（黑金）">🏠</button>
      <button class="theme-btn" id="themeToggleBtn" title="切换亮暗">🌓</button>
      <div class="theme-dropdown">
        <button class="theme-btn" id="themeSelectBtn" title="选择配色主题">🎨</button>
        <div class="dropdown-content" id="themeDropdown"></div>
      </div>
    </div>
  </div>
</div>

<!-- Main -->
<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">播放列表</div>
      <div class="track-count" id="trackCount">0 首</div>
    </div>
    <div class="playlist" id="playlist">
      <div class="drop-zone" id="dropZone">
        <div class="drop-icon">
          <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        </div>
        <div class="drop-text">拖放音乐文件到这里</div>
        <div class="drop-hint">支持 MP3 / WAV / OGG / FLAC / AAC / M4A</div>
      </div>
      <div class="playlist-empty" id="playlistEmpty" style="display:none;">
        <div class="playlist-empty-text">播放列表为空<br>点击上方「添加音乐」开始</div>
      </div>
    </div>
  </div>

  <!-- Center Stage -->
  <div class="center-stage" id="centerStage">
    <div class="main-area fade-up">
      <div class="left-panel">
        <div class="visualizer-wrap">
          <div class="vinyl" id="vinyl">
            <div class="vinyl-label">
              <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            </div>
          </div>
          <canvas class="visualizer-canvas" id="visualizerCanvas"></canvas>
        </div>
        <div class="now-playing-info">
          <div class="now-playing-title" id="nowPlayingTitle">—</div>
          <div class="now-playing-artist" id="nowPlayingArtist">未知艺术家</div>
        </div>
      </div>

      <div class="right-panel">
        <div class="lyrics-section" id="lyricsSection" style="display:none;">
          <div id="lyricsContainer"></div>
        </div>
      </div>
    </div>

    <div class="progress-section fade-up fade-up-d3">
      <div class="progress-bar-wrap" id="progressBar">
        <div class="progress-filled" id="progressFilled" style="width:0%">
          <div class="progress-thumb"></div>
        </div>
      </div>
      <div class="progress-times">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <div class="controls fade-up fade-up-d3">
      <button class="ctrl-btn" id="shuffleBtn" title="随机播放">
        <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="ctrl-btn" id="prevBtn" title="上一曲">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" title="播放/暂停">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="下一曲">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" title="循环模式">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
      <div class="volume-section">
        <svg viewBox="0 0 24 24" id="volumeIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
        <span class="volume-val" id="volumeVal">80%</span>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <div class="bottom-left">
    <span class="format-badge" id="formatBadge" style="display:none;">MP3</span>
  </div>
  <div class="bottom-center"></div>
  <div class="bottom-right">
    <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);">ZDM-Player v2.0</span>
  </div>
</div>

<input type="file" id="fileInput" multiple accept="audio/*">

<script>
(() => {
  // ===== 主题系统 =====
  const DARK_THEMES = [
    { id: 'dark-green', name: '黑绿极客', dot: '#00ff41' },
    { id: 'cyber', name: '赛博霓虹', dot: '#00D2FF' },
    { id: 'titanium', name: '工业钛金', dot: '#4FC3F7' },
    { id: 'amber', name: '琥珀终端', dot: '#FFB000' },
    { id: 'deepsea', name: '深海极客', dot: '#64FFDA' },
    { id: 'dark-purple', name: '暗夜紫晶', dot: '#C084FC' },
    { id: 'dark-red', name: '碳纤赤焰', dot: '#FF4500' }
  ];
  const LIGHT_THEMES = [
    { id: 'light-white', name: '纯净日白', dot: '#333333' },
    { id: 'light-mint', name: '清凉薄荷', dot: '#10B981' },
    { id: 'light-milk', name: '温润奶茶', dot: '#D4A373' },
    { id: 'light-sky', name: '天空蓝调', dot: '#0284C7' },
    { id: 'light-sakura', name: '樱花物语', dot: '#F43F5E' },
    { id: 'light-silver', name: '高级银灰', dot: '#475569' },
    { id: 'light-orange', name: '活力橙光', dot: '#EA580C' }
  ];

  let isDarkMode = true;
  let currentTheme = localStorage.getItem('zdm_theme') || 'default';

  function getActiveThemes() {
    return isDarkMode ? DARK_THEMES : LIGHT_THEMES;
  }

  // 应用主题
  function applyTheme(themeId) {
    // 黑金主题（特殊处理）
    if (themeId === 'default') {
      document.documentElement.removeAttribute('data-theme');
      isDarkMode = true;
      localStorage.setItem('zdm_darkmode', 'true');
      localStorage.setItem('zdm_theme', 'default');
      currentTheme = 'default';
      // 清除下拉菜单高亮
      document.querySelectorAll('#themeDropdown .dropdown-item').forEach(el => {
        el.classList.remove('selected');
      });
      renderThemeDropdown();
      return;
    }

    // 普通主题
    const allThemes = [...DARK_THEMES, ...LIGHT_THEMES];
    const theme = allThemes.find(t => t.id === themeId);
    if (!theme) {
      console.warn('主题不存在:', themeId);
      return;
    }

    document.documentElement.setAttribute('data-theme', themeId);
    localStorage.setItem('zdm_theme', themeId);
    currentTheme = themeId;
    // 高亮当前主题
    document.querySelectorAll('#themeDropdown .dropdown-item').forEach(el => {
      el.classList.toggle('selected', el.dataset.theme === themeId);
    });
    renderThemeDropdown();
  }

  // 切换亮暗
  function toggleDarkMode() {
    // 切换亮暗
    isDarkMode = !isDarkMode;
    localStorage.setItem('zdm_darkmode', isDarkMode ? 'true' : 'false');

    // 获取当前模式下的第一个主题
    const activeThemes = getActiveThemes();
    if (!activeThemes || activeThemes.length === 0) {
      console.warn('没有可用的主题');
      return;
    }
    const firstThemeId = activeThemes[0].id;

    // 应用该主题（自动更新菜单）
    applyTheme(firstThemeId);
  }

  // 渲染主题下拉菜单
  function renderThemeDropdown() {
    const themes = getActiveThemes();
    const container = document.getElementById('themeDropdown');
    container.innerHTML = themes.map(t =>
      `<button class="dropdown-item" data-theme="${t.id}">
        <span class="color-dot" style="background:${t.dot};"></span>
        ${t.name}
      </button>`
    ).join('');
    container.querySelectorAll('.dropdown-item').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const tid = el.dataset.theme;
        if (tid) {
          applyTheme(tid);
          document.getElementById('themeDropdown').classList.remove('show');
        }
      });
    });
    // 高亮当前
    container.querySelectorAll('.dropdown-item').forEach(el => {
      el.classList.toggle('selected', el.dataset.theme === currentTheme);
    });
  }

  // 初始化主题
  function initTheme() {
    const savedTheme = localStorage.getItem('zdm_theme');
    const savedDark = localStorage.getItem('zdm_darkmode');
    isDarkMode = savedDark !== 'false';
    if (savedTheme && savedTheme !== 'default') {
      applyTheme(savedTheme);
    } else {
      applyTheme('default');
    }
    renderThemeDropdown();
  }

  // ===== DOM 事件绑定 =====
  document.getElementById('defaultThemeBtn').addEventListener('click', () => applyTheme('default'));
  document.getElementById('themeToggleBtn').addEventListener('click', toggleDarkMode);
  document.getElementById('themeSelectBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('themeDropdown').classList.toggle('show');
  });
  document.addEventListener('click', () => {
    document.getElementById('themeDropdown').classList.remove('show');
  });

  // 启动主题
  initTheme();

  // ===== 播放器核心 =====
  // ── State ──
  const state = {
    tracks: [],
    currentIndex: -1,
    isPlaying: false,
    shuffle: false,
    repeat: 0,
    volume: 0.8,
    lyrics: null,
    userScrolledLyrics: false,
    lyricsScrollTimer: null,
  };

  // ── Audio setup ──
  const audio = new Audio();
  audio.volume = state.volume;

  let audioCtx, analyser, source, dataArray, bufferLength;
  let visualizerInitialized = false;

  function initAudioContext() {
    if (visualizerInitialized) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    visualizerInitialized = true;
  }

  // ── DOM 引用 ──
  const $ = id => document.getElementById(id);
  const dropZone = $('dropZone');
  const playlistEl = $('playlist');
  const playlistEmpty = $('playlistEmpty');
  const trackCount = $('trackCount');
  const centerStage = $('centerStage');
  const vinyl = $('vinyl');
  const playBtn = $('playBtn');
  const playIcon = $('playIcon');
  const prevBtn = $('prevBtn');
  const nextBtn = $('nextBtn');
  const shuffleBtn = $('shuffleBtn');
  const repeatBtn = $('repeatBtn');
  const progressBar = $('progressBar');
  const progressFilled = $('progressFilled');
  const currentTimeEl = $('currentTime');
  const totalTimeEl = $('totalTime');
  const nowPlayingTitle = $('nowPlayingTitle');
  const nowPlayingArtist = $('nowPlayingArtist');
  const volumeSlider = $('volumeSlider');
  const volumeVal = $('volumeVal');
  const volumeIcon = $('volumeIcon');
  const formatBadge = $('formatBadge');
  const fileInput = $('fileInput');
  const addFilesBtn = $('addFilesBtn');
  const canvas = $('visualizerCanvas');
  const ctx = canvas.getContext('2d');
  const lyricsContainer = $('lyricsContainer');
  const lyricsSection = $('lyricsSection');
  const folderBtn = $('folderBtn');
  const clock = $('clock');

  // ── File Handling ──
  addFilesBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    await handleFiles(e.target.files);
  });

  document.body.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragging');
  });

  document.body.addEventListener('dragleave', e => {
    if (!e.relatedTarget || e.relatedTarget === document.documentElement) {
      dropZone.classList.remove('dragging');
    }
  });

  document.body.addEventListener('drop', async (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragging');
    await handleFiles(e.dataTransfer.files);
  });

  async function handleFiles(files) {
    // 分离音频和歌词
    const lrcFiles = [...files].filter(f => f.name.toLowerCase().endsWith('.lrc'));
    const audioFiles = [...files].filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|aac|m4a|wma)$/i.test(f.name));
    if (!audioFiles.length) return;

    // 读取所有歌词内容到数组
    const lrcData = [];
    for (const lrcFile of lrcFiles) {
      const baseName = lrcFile.name.replace(/\.lrc$/i, '').toLowerCase();
      try {
        const text = await lrcFile.text();  // 使用 File 的 text() 方法
        lrcData.push({ name: baseName, content: text });
      } catch {}
    }

    // 处理音频文件并匹配歌词
    audioFiles.forEach(file => {
      const url = URL.createObjectURL(file);
      const name = file.name.replace(/\.[^/.]+$/, '');
      let title = name, artist = '未知艺术家';
      const match = name.match(/^(.+?)\s*[-–—]\s*(.+)$/);
      if (match) {
        artist = match[2].trim();
        title = match[1].trim();
      }
      const ext = file.name.split('.').pop().toUpperCase();

      // 按完整文件名匹配，失败则用歌曲名模糊匹配
      let matched = lrcData.find(l => l.name === name.toLowerCase());
      if (!matched) {
        const songTitle = title.toLowerCase();
        matched = lrcData.find(l => l.name.includes(songTitle));
      }
      const lrcContent = matched ? matched.content : null;

      state.tracks.push({ url, title, artist, ext, file, lrc: lrcContent });
    });

    renderPlaylist();
    if (state.currentIndex === -1) {
      loadTrack(0);
    }
  }

  function renderPlaylist() {
    const hasTracks = state.tracks.length > 0;
    dropZone.style.display = hasTracks ? 'none' : 'flex';
    playlistEmpty.style.display = hasTracks ? 'none' : 'flex';
    trackCount.textContent = `${state.tracks.length} 首`;

    playlistEl.querySelectorAll('.track-item').forEach(el => el.remove());

    state.tracks.forEach((track, i) => {
      const el = document.createElement('div');
      el.className = 'track-item' + (i === state.currentIndex ? ' active' : '');
      el.innerHTML = `
        <div class="track-number">
          <span>${i + 1}</span>
          <div class="playing-indicator">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          </div>
        </div>
        <div class="track-info">
          <div class="track-name">${track.title}</div>
          <div class="track-meta">${track.artist}</div>
        </div>
        <div class="track-duration">${track.ext}</div>
      `;
      el.addEventListener('click', () => {
        loadTrack(i);
        play();
      });
      playlistEl.appendChild(el);
    });
  }

  // ── Playback ──
  function loadTrack(index) {
    if (index < 0 || index >= state.tracks.length) return;

    // 暂停当前播放
    audio.pause();

    state.currentIndex = index;
    const track = state.tracks[index];
  
    // 每次切歌重新生成 URL，避免之前释放导致失效
    const newUrl = URL.createObjectURL(track.file);
    audio.src = newUrl;
    audio.load();

    nowPlayingTitle.textContent = track.title;
    nowPlayingArtist.textContent = track.artist;
    formatBadge.textContent = track.ext;
    formatBadge.style.display = 'inline-block';

    if (track.lrc) {
      parseLRC(track.lrc);
    } else {
      state.lyrics = null;
      lyricsSection.style.display = 'none';
      lyricsContainer.innerHTML = '';
    }

    centerStage.classList.add('visible');
    renderPlaylist();

    if (state.isPlaying) {
      setTimeout(() => {
        audio.play().catch(() => {
          audio.addEventListener('canplay', function handler() {
            audio.removeEventListener('canplay', handler);
            if (state.isPlaying) audio.play();
          });
        });
      }, 50);
    }
  }

  function play() {
    initAudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audio.play().catch(() => {
      audio.addEventListener('canplay', function handler() {
        audio.removeEventListener('canplay', handler);
        audio.play();
      });
    });
    state.isPlaying = true;
    vinyl.classList.add('playing');
    updatePlayIcon();
    drawVisualizer();
  }

  function pause() {
    audio.pause();
    state.isPlaying = false;
    vinyl.classList.remove('playing');
    updatePlayIcon();
  }

  function togglePlay() {
    if (state.tracks.length === 0) return;
    state.isPlaying ? pause() : play();
  }

  function updatePlayIcon() {
    playIcon.innerHTML = state.isPlaying
      ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
  }

  function playNext() {
    if (state.tracks.length === 0) return;

    // 单曲循环：重新加载当前歌曲
    if (state.repeat === 2) {
      loadTrack(state.currentIndex);
      play();
      return;
    }

    let next;
    if (state.shuffle) {
      next = Math.floor(Math.random() * state.tracks.length);
    } else {
      next = (state.currentIndex + 1) % state.tracks.length;
      // 如果到达末尾且不循环，停止播放
      if (next === 0 && state.repeat === 0) {
        pause();
        return;
      }
    }
    loadTrack(next);
    play();
  }

  function playPrev() {
    if (state.tracks.length === 0) return;

    // 单曲循环：直接重新加载当前歌
    if (state.repeat === 2) {
      loadTrack(state.currentIndex);
      play();
      return;
    }

    // 如果当前播放时间大于 3 秒，归零（这是原来的快速回退功能）
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      return;
    }

    let prev;
    if (state.shuffle) {
      prev = Math.floor(Math.random() * state.tracks.length);
    } else {
      // 全部循环模式下，如果当前是第一首，跳到最后一首
      if (state.repeat === 1 && state.currentIndex === 0) {
        prev = state.tracks.length - 1;
      } else {
        prev = (state.currentIndex - 1 + state.tracks.length) % state.tracks.length;
      }
    }
    loadTrack(prev);
    play();
  }

  // ── LRC ──
  function parseLRC(text) {
    const lines = text.split('\n');
    const parsed = [];

    // 定义多种时间格式的正则
    const formats = [
      // 格式1: [mm:ss.cc] 或 [mm:ss.c] 或 [mm:ss.ccc]（百分秒/毫秒）
      { regex: /\[(\d{2}):(\d{2})\.(\d{1,3})\](.*)/, type: 'ms' },
      // 格式2: [mm:ss] 只有分钟秒
      { regex: /\[(\d{2}):(\d{2})\](.*)/, type: 'ss' },
      // 格式3: [hh:mm:ss] 小时分钟秒
      { regex: /\[(\d{2}):(\d{2}):(\d{2})\](.*)/, type: 'hms' },
      // 格式4: 更宽泛的数字:数字.数字（允许数字位数不固定）
      { regex: /\[(\d+):(\d+)\.(\d+)\](.*)/, type: 'ms' },
      // 格式5: 更宽泛的数字:数字（允许数字位数不固定）
      { regex: /\[(\d+):(\d+)\](.*)/, type: 'ss' },
    ];

    for (const line of lines) {
      for (const fmt of formats) {
        const match = line.match(fmt.regex);
        if (!match) continue;

        let time = 0;
        let text = '';

        if (fmt.type === 'ms') {
          // [mm:ss.cc] 或 [mm:ss.c] 或 [mm:ss.ccc]
          const minutes = parseInt(match[1], 10);
          const seconds = parseInt(match[2], 10);
          const centi = parseInt(match[3], 10);
          // 如果是三位数，按毫秒处理，否则按百分秒
          const denominator = match[3].length >= 3 ? 1000 : 100;
          time = minutes * 60 + seconds + centi / denominator;
          text = match[4] ? match[4].trim() : '';
        } else if (fmt.type === 'ss') {
          // [mm:ss]
          const minutes = parseInt(match[1], 10);
          const seconds = parseInt(match[2], 10);
          time = minutes * 60 + seconds;
          text = match[3] ? match[3].trim() : '';
        } else if (fmt.type === 'hms') {
          // [hh:mm:ss]
          const hours = parseInt(match[1], 10);
          const minutes = parseInt(match[2], 10);
          const seconds = parseInt(match[3], 10);
          time = hours * 3600 + minutes * 60 + seconds;
          text = match[4] ? match[4].trim() : '';
        }

        if (text) {
          parsed.push({ time, text });
        }
        break; // 匹配到一个格式就跳出内层循环
      }
    }

    // 按时间排序
    parsed.sort((a, b) => a.time - b.time);
    state.lyrics = { lines: parsed };
    displayLyrics();
  }

  function displayLyrics() {
    if (!state.lyrics || !state.lyrics.lines.length) {
      lyricsSection.style.display = 'none';
      lyricsContainer.innerHTML = '';
      return;
    }
    lyricsSection.style.display = 'block';
    lyricsContainer.innerHTML = state.lyrics.lines.map((line, i) =>
      `<div class="lyrics-line" data-index="${i}">${line.text}</div>`
    ).join('');
    state.userScrolledLyrics = false;
    if (state.lyricsScrollTimer) {
      clearTimeout(state.lyricsScrollTimer);
      state.lyricsScrollTimer = null;
    }
    updateLyrics(0);
  }

  function updateLyrics(currentTime) {
    const lines = state.lyrics?.lines;
    if (!lines) return;
    let activeIndex = -1;
    for (let i = lines.length - 1; i >= 0; i--) {
      if (lines[i].time <= currentTime) {
        activeIndex = i;
        break;
      }
    }
    const items = lyricsContainer.querySelectorAll('.lyrics-line');
    items.forEach((el, idx) => {
      el.classList.toggle('active', idx === activeIndex);
    });

    if (!state.userScrolledLyrics && activeIndex >= 0) {
      const activeEl = items[activeIndex];
      if (activeEl) {
        activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }
  }

  lyricsSection.addEventListener('scroll', () => {
    if (lyricsSection.style.display === 'none') return;
    state.userScrolledLyrics = true;
    if (state.lyricsScrollTimer) {
      clearTimeout(state.lyricsScrollTimer);
    }
    state.lyricsScrollTimer = setTimeout(() => {
      state.userScrolledLyrics = false;
      state.lyricsScrollTimer = null;
      if (state.isPlaying && audio.duration) {
        updateLyrics(audio.currentTime);
      }
    }, 5000);
  });

  // ── Events ──
  playBtn.addEventListener('click', togglePlay);
  nextBtn.addEventListener('click', playNext);
  prevBtn.addEventListener('click', playPrev);

  shuffleBtn.addEventListener('click', () => {
    state.shuffle = !state.shuffle;
    shuffleBtn.classList.toggle('active', state.shuffle);
  });

  repeatBtn.addEventListener('click', () => {
    state.repeat = (state.repeat + 1) % 3;
    repeatBtn.classList.toggle('active', state.repeat > 0);
    if (state.repeat === 2) {
      repeatBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><text x="12" y="15" text-anchor="middle" font-size="7" fill="currentColor" font-weight="bold">1</text></svg>';
    } else {
      repeatBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>';
    }
  });

  audio.addEventListener('ended', playNext);

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFilled.style.width = pct + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
    totalTimeEl.textContent = formatTime(audio.duration);
    updateLyrics(audio.currentTime);
  });

  progressBar.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  // Volume
  volumeSlider.addEventListener('input', () => {
    state.volume = volumeSlider.value / 100;
    audio.volume = state.volume;
    volumeVal.textContent = volumeSlider.value + '%';
    updateVolumeIcon();
  });

  volumeIcon.addEventListener('click', () => {
    if (audio.volume > 0) {
      state.prevVolume = audio.volume;
      audio.volume = 0;
      volumeSlider.value = 0;
      volumeVal.textContent = '0%';
    } else {
      audio.volume = state.prevVolume || 0.8;
      volumeSlider.value = audio.volume * 100;
      volumeVal.textContent = Math.round(audio.volume * 100) + '%';
    }
    updateVolumeIcon();
  });

  function updateVolumeIcon() {
    const v = audio.volume;
    if (v === 0) {
      volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
    } else if (v < 0.5) {
      volumeIcon.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
    } else {
      volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    }
  }

  // ── Folder Persistence ──
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('MiMoPlayerDB', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveFolderHandle(handle) {
    const db = await openDB();
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(handle, 'musicDir');
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function loadFolderHandle() {
    const db = await openDB();
    const tx = db.transaction('handles', 'readonly');
    const store = tx.objectStore('handles');
    return new Promise((resolve, reject) => {
      const req = store.get('musicDir');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function scanFolderRecursive(handle) {
    const audioFiles = [];
    const lrcFiles = [];
    for await (const entry of handle.values()) {
      if (entry.kind === 'file') {
        const file = await entry.getFile();
        const name = file.name.toLowerCase();
        if (name.endsWith('.lrc')) {
          lrcFiles.push(file);
        } else if (file.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|aac|m4a|wma)$/i.test(name)) {
          audioFiles.push(file);
        }
      } else if (entry.kind === 'directory') {
        const sub = await scanFolderRecursive(entry);
        audioFiles.push(...sub.audioFiles);
        lrcFiles.push(...sub.lrcFiles);
      }
    }
    return { audioFiles, lrcFiles };
  }

  async function loadFolder(handle) {
    try {
      const opts = { mode: 'read' };
      let perm = await handle.queryPermission(opts);
      if (perm !== 'granted') perm = await handle.requestPermission(opts);
      if (perm !== 'granted') return;
    } catch { return; }

    const { audioFiles, lrcFiles } = await scanFolderRecursive(handle);
    if (!audioFiles.length) return;

    // 读取所有歌词内容到数组（避免全局映射覆盖）
    const lrcData = [];
    for (const lrcFile of lrcFiles) {
      const baseName = lrcFile.name.replace(/\.lrc$/i, '').toLowerCase();
      try {
        const text = await lrcFile.text();
        lrcData.push({ name: baseName, content: text });
      } catch {}
    }

    audioFiles.forEach(file => {
      const url = URL.createObjectURL(file);
      const name = file.name.replace(/\.[^/.]+$/, '');
      let title = name, artist = '未知艺术家';
      const match = name.match(/^(.+?)\s*[-–—]\s*(.+)$/);
      if (match) {
        artist = match[2].trim();
        title = match[1].trim();
      }
      const ext = file.name.split('.').pop().toUpperCase();

      // 独立匹配歌词（先精确匹配，失败则用歌曲名模糊匹配）
      let matched = lrcData.find(l => l.name === name.toLowerCase());
      if (!matched) {
        // 用歌曲名（title）去匹配，只要歌词文件名包含该歌曲名即可
        const songTitle = title.toLowerCase();
        matched = lrcData.find(l => l.name.includes(songTitle));
      }
      const lrcContent = matched ? matched.content : null;

      state.tracks.push({ url, title, artist, ext, file, lrc: lrcContent });
    });

    renderPlaylist();
    if (state.currentIndex === -1) {
      loadTrack(0);
    }
    await saveFolderHandle(handle);
    folderBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> 已关联文件夹';
    folderBtn.title = '已记忆此文件夹，下次自动加载';
    folderBtn.style.borderColor = 'var(--success)';
    folderBtn.style.color = 'var(--success)';
  }

  let savedHandle = null;

  async function pickFolder() {
    if (!window.showDirectoryPicker) { alert('当前浏览器不支持选择文件夹，请使用 Chrome / Edge 最新版。'); return; }
    try {
      const handle = await window.showDirectoryPicker();
      await loadFolder(handle);
    } catch {}
  }

  folderBtn.addEventListener('click', async () => {
    if (savedHandle) {
      try {
        const opts = { mode: 'read' };
        const ok = await savedHandle.requestPermission(opts);
        if (ok === 'granted') {
          await loadFolder(savedHandle);
          return;
        }
      } catch {}
    }
    await pickFolder();
  });

  (async function restoreFolder() {
    if (!window.showDirectoryPicker) return;
    const handle = await loadFolderHandle();
    if (!handle) return;
    savedHandle = handle;
    const opts = { mode: 'read' };
    const granted = await handle.queryPermission(opts) === 'granted';
    if (granted) {
      await loadFolder(handle);
    } else {
      folderBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> 点击恢复上次的文件夹';
      folderBtn.style.borderColor = 'var(--accent)';
      folderBtn.style.color = 'var(--accent)';
      folderBtn.title = '点击重新授权，恢复上次关联的音乐文件夹';
    }
  })();

  // ── Keyboard ──
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); }
    if (e.code === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); }
    if (e.code === 'ArrowUp') { e.preventDefault(); volumeSlider.value = Math.min(100, +volumeSlider.value + 5); volumeSlider.dispatchEvent(new Event('input')); }
    if (e.code === 'ArrowDown') { e.preventDefault(); volumeSlider.value = Math.max(0, +volumeSlider.value - 5); volumeSlider.dispatchEvent(new Event('input')); }
  });

  // ── Visualizer ──
  function resizeCanvas() {
    canvas.width = canvas.offsetWidth * window.devicePixelRatio;
    canvas.height = canvas.offsetHeight * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawVisualizer() {
    if (!state.isPlaying || !analyser) return;
    requestAnimationFrame(drawVisualizer);

    analyser.getByteFrequencyData(dataArray);
    const w = canvas.offsetWidth;
    const h = canvas.offsetHeight;
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2;
    const radius = 80;
    const bars = 48;
    const step = Math.floor(bufferLength / bars);

    for (let i = 0; i < bars; i++) {
      const val = dataArray[i * step] / 255;
      const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
      const barH = 6 + val * 40;

      const x1 = cx + Math.cos(angle) * radius;
      const y1 = cy + Math.sin(angle) * radius;
      const x2 = cx + Math.cos(angle) * (radius + barH);
      const y2 = cy + Math.sin(angle) * (radius + barH);

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = `rgba(212, 168, 67, ${0.3 + val * 0.7})`;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }

  // ── Clock ──
  function updateClock() {
    const now = new Date();
    const y = now.getFullYear();
    const mon = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    clock.textContent = y + '.' + mon + '.' + d + '  ' + h + ':' + m + ':' + s;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── Helpers ──
  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }
})();
</script>
